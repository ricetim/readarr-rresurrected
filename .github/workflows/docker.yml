name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

# One build per ref at a time. Two pushes to develop in quick succession used to start two
# builds side by side, and whichever finished last took :develop, sometimes the older commit.
# Now a newer branch build cancels the older one; its tag only moves when the final manifest is
# pushed, so a cancelled build leaves :develop where it was. Each release tag is its own ref and
# is never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The arm64 image's runtime stage (apk and pip) runs under emulation. Both builder
      # stages run natively and cross-compile; see the Dockerfile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A tagged build is a release and owns :latest. An untagged develop push publishes
      # :develop instead, with the run number as the fourth version field so successive dev
      # builds are distinguishable and always sort above the release they follow.
      # Cutting a release pushes the branch and the tag, so both runs start within seconds of
      # each other. While they both wrote :latest, whichever finished last won it, and the
      # develop build usually did — leaving :latest on a dev-numbered image.
      # Any other branch (a manual run to test a PR, say) builds but publishes nothing. It
      # would otherwise take the develop path below and overwrite :develop with unmerged code.
      - name: Derive version and tags
        id: meta
        run: |
          BASE=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          if [ -z "$BASE" ]; then echo "no version heading in CHANGELOG.md" >&2; exit 1; fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ASSEMBLY="${VERSION}.0"
            MINOR="${VERSION%.*}"
            TAGS="ricetim/readarr-rresurrected:${VERSION}"
            TAGS="${TAGS},ricetim/readarr-rresurrected:${MINOR}"
            TAGS="${TAGS},ricetim/readarr-rresurrected:latest"
            if [ "$VERSION" != "$BASE" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match CHANGELOG version ${BASE}" >&2
              exit 1
            fi
          else
            VERSION="${BASE}"
            ASSEMBLY="${BASE}.${GITHUB_RUN_NUMBER}"
            TAGS="ricetim/readarr-rresurrected:develop"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF_NAME}" = "develop" ]; then
            PUSH=true
          else
            PUSH=false
          fi

          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "assembly=${ASSEMBLY}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}"         >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}"         >> "$GITHUB_OUTPUT"
          if [ "$PUSH" = "true" ]; then
            echo "Building ${ASSEMBLY} -> ${TAGS}"
          else
            echo "Building ${ASSEMBLY} from ${GITHUB_REF_NAME} (build only, nothing will be pushed)"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            ASSEMBLY_VERSION=${{ steps.meta.outputs.assembly }}
            BRANCH=develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub README
        if: steps.meta.outputs.push == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ricetim/readarr-rresurrected
          readme-filepath: ./README-docker.md
