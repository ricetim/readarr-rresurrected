name: 'Lock threads'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  lock:
    runs-on: ubuntu-latest

    # The repository default for the automatic token is read-only, and locking a
    # thread is a write. Without this the action fails before it logs anything.
    # Discussions are disabled on this repo, so they need no grant.
    permissions:
      issues: write
      pull-requests: write

    steps:
      # v4 validates github-token against a 100 character maximum, and GitHub's
      # automatic token has since grown past that, so every run failed on input
      # validation before doing any work. v6 raises the cap and runs on node24.
      - uses: dessant/lock-threads@v6
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: '90'
          exclude-issue-created-before: ''
          exclude-any-issue-labels: ''
          add-issue-labels: ''
          issue-comment: ''
          issue-lock-reason: 'resolved'
          process-only: ''
