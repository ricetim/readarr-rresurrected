# Keeps the actions in .github/workflows current. Workflows pin each action to a major
# version (actions/checkout@v4), so this mostly surfaces new majors, which can change
# inputs or defaults; check the action's release notes before merging.
#
# All updates arrive as one weekly PR rather than one PR per action.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
